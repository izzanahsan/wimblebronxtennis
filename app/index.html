<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wimblebronx</title>
<meta name="description" content="Tennis match days and leagues — Americano, live scores, Instagram results.">
<meta name="theme-color" content="#2E0A52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wimblebronx">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <div class="loading-logo"><img src="icon-512.png" alt="" width="112" height="112">Wimblebronx</div>
  <div class="loading-spinner"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="topbar">
  <header class="header" id="event-header"></header>
  <nav class="nav" id="event-nav" style="display:none"></nav>
</div>

<main class="page active" id="view"></main>

<div class="modal-overlay" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="modal">
    <button class="modal-close" onclick="closeSheet()" aria-label="Close">×</button>
    <div id="sheet-body"></div>
  </div>
</div>

<!-- Load order: config → utils → engines → api → views → app (boots) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/stats.js"></script>
<script src="js/americano.js"></script>
<script src="js/story.js"></script>
<script src="js/api.js"></script>
<script src="js/scorer.js"></script>
<script src="js/day.js"></script>
<script src="js/league.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>

</body>
</html>
